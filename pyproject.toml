[project]
name = "data-scout"
version = "0.1.0"
description = "Profile unknown unstructured datasets with an agent that authors measurements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "nbformat",
    "nbconvert",
    "ipykernel",
    "datasketch",
    "wordfreq",
    "textdescriptives",
    # Declared explicitly rather than relied on transitively through
    # textdescriptives: a transitive dependency is luck, a declared one is a
    # contract (data-scout-genproj-scaffold §7).
    "pandas",
    # The observation cache. Adopted, not built: only the key is bespoke.
    "diskcache",
    # partition_doc is a library client for the Docling sidecar, not a model.
    "httpx",
    # near_dup_images: phash clusters.
    "pillow",
    "imagehash",
    # report-render: report-*.md -> .html with one stylesheet.
    "markdown-it-py",
    # The MCP façade (design §2.4): the belt as tools, on the same port. Pinned
    # below 3 because 2.x renamed FastMCP -> MCPServer and this code uses 2.x.
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4"
]
# Tier 2 and optional. `pip install -e ".[semantic]"`. The tier-2 instruments
# (embed_sample, cluster_topics, image_inventory) fail loudly, naming this
# extra and the install command, when it is absent -- never silently zero.
semantic = [
    "numpy",
    "scipy",
    "scikit-learn",
    "umap-learn",
    "hdbscan",
    "bertopic",
]

[project.scripts]
report-render = "data_scout.render:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_scout = ["styles/*.css", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
# Pin the language level. Without it ruff infers target-version from
# requires-python, and target-gated rules (e.g. UP017 "use datetime.UTC") then
# switch on or off depending on how the config resolved.
target-version = "py311"

[tool.ruff.lint]
# Pin the enforced rule set. Without an explicit select the enabled set is
# whatever ruff's built-in default is for the resolved target version, which
# also drifts between ruff releases - so the same source could pass locally
# and fail in CI (or vice versa). Written down here so `ruff check src tests`
# is deterministic and local lint agrees with CI. Update `select` (or add
# `ignore`) deliberately when you want a different rule set.
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
